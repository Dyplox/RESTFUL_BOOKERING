name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Todos los días a las 06:00 UTC: detecta cambios en la API pública aunque no haya commits
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      entorno:
        description: 'Entorno de serenity.conf'
        type: choice
        options: [docker, publico]
        default: docker
      tags:
        description: 'Expresión de tags de Cucumber (vacío = todo menos @defectoConocido y @rendimiento)'
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verificacion:
    name: Unitarias, features y Javadoc (sin red)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '27'

      - uses: gradle/actions/setup-gradle@v4

      - name: Pruebas unitarias
        run: ./gradlew unitTest

      - name: Validar que todos los pasos de las features están implementados
        run: ./gradlew validarFeatures

      - name: Javadoc
        run: ./gradlew javadoc

      - name: Publicar resultados unitarios
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resultados-unitarios
          path: build/test-results/unitTest/
          if-no-files-found: ignore

  api:
    name: Pruebas de API (${{ github.event_name == 'schedule' && 'publico' || inputs.entorno || 'docker' }})
    needs: verificacion
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Push y PR: contenedor local (rápido y aislado). Diario: API pública, para detectar cambios en ella.
      ENTORNO: ${{ github.event_name == 'schedule' && 'publico' || inputs.entorno || 'docker' }}
      TAGS: ${{ inputs.tags }}
    services:
      restfulbooker:
        image: mwinteringham/restfulbooker:latest
        ports:
          - 3001:3001
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '27'

      - uses: gradle/actions/setup-gradle@v4

      - name: Esperar a que el contenedor de Restful Booker responda
        if: env.ENTORNO == 'docker'
        run: |
          for i in $(seq 1 30); do
            if [ "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3001/ping)" = "201" ]; then
              echo "Restful Booker listo"; exit 0
            fi
            sleep 2
          done
          echo "Restful Booker no respondió en 60 s"; exit 1

      - name: Pruebas de API
        run: |
          if [ -n "$TAGS" ]; then
            ./gradlew test -Penv="$ENTORNO" -Ptags="$TAGS"
          else
            ./gradlew test -Penv="$ENTORNO"
          fi

      # Solo en la ejecución diaria, a título informativo: depende de la latencia de la red
      - name: Pruebas de rendimiento (informativo)
        if: github.event_name == 'schedule'
        continue-on-error: true
        run: ./gradlew test -Penv="$ENTORNO" -Ptags="@rendimiento"

      - name: Publicar reporte de Serenity
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reporte-serenity-${{ env.ENTORNO }}
          path: target/site/serenity/
          if-no-files-found: ignore

      - name: Publicar resultados JUnit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resultados-api-${{ env.ENTORNO }}
          path: build/test-results/test/
          if-no-files-found: ignore

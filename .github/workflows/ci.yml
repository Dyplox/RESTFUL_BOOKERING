name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Todos los días a las 06:00 UTC: detecta cambios en la API pública aunque no haya commits
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      entorno:
        description: 'Entorno de serenity.conf'
        type: choice
        options: [docker, publico]
        default: docker
      tags:
        description: 'Expresión de tags de Cucumber (vacío = todo menos @defectoConocido y @rendimiento)'
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Push y PR: contenedor local (rápido y aislado). Diario: API pública, para detectar cambios en ella.
  ENTORNO: ${{ github.event_name == 'schedule' && 'publico' || inputs.entorno || 'docker' }}

# Las actions están fijadas por SHA (con la versión en el comentario); Dependabot las actualiza.
jobs:
  verificacion:
    name: Unitarias, features y Javadoc (sin red)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '27'

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Pruebas unitarias
        run: ./gradlew unitTest

      - name: Validar que todos los pasos de las features están implementados
        run: ./gradlew validarFeatures

      - name: Javadoc
        run: ./gradlew javadoc

      - name: Resumen
        if: always()
        run: python3 .github/scripts/resumen_pruebas.py build/test-results/unitTest "Pruebas unitarias" >> "$GITHUB_STEP_SUMMARY"

      - name: Publicar resultados unitarios
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: resultados-unitarios
          path: build/test-results/unitTest/
          if-no-files-found: ignore

  api:
    name: Pruebas de API (${{ github.event_name == 'schedule' && 'publico' || inputs.entorno || 'docker' }})
    needs: verificacion
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TAGS: ${{ inputs.tags }}
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Historial completo: SonarQube Cloud lo usa para distinguir el código nuevo del antiguo
          fetch-depth: 0

      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '27'

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      # La imagen se fija por digest en docker-compose.yml (Dependabot la actualiza)
      - name: Levantar Restful Booker
        if: env.ENTORNO == 'docker'
        run: |
          docker compose up -d
          for _ in $(seq 1 30); do
            if [ "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3001/ping)" = "201" ]; then
              echo "Restful Booker listo"; exit 0
            fi
            sleep 2
          done
          echo "Restful Booker no respondió en 60 s"; docker compose logs; exit 1

      - name: Pruebas de API
        run: |
          if [ -n "$TAGS" ]; then
            ./gradlew test -Penv="$ENTORNO" -Ptags="$TAGS"
          else
            ./gradlew test -Penv="$ENTORNO"
          fi

      - name: Resumen
        if: always()
        run: python3 .github/scripts/resumen_pruebas.py build/test-results/test "Pruebas de API ($ENTORNO)" >> "$GITHUB_STEP_SUMMARY"

      # Cobertura combinada (unitarias + API) con umbral mínimo (build.gradle): falla si baja.
      # Solo con la suite completa: con una expresión de tags la cobertura es parcial.
      - name: Cobertura (umbral mínimo)
        if: env.TAGS == ''
        run: ./gradlew unitTest jacocoTestReport jacocoTestCoverageVerification

      # Análisis en SonarQube Cloud con el informe de cobertura del paso anterior. Se omite si el
      # repositorio no tiene el secreto SONAR_TOKEN, y en la ejecución diaria (no hay código nuevo).
      - name: SonarQube Cloud
        if: env.SONAR_TOKEN != '' && env.TAGS == '' && github.event_name != 'schedule'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew sonar -Dsonar.qualitygate.wait=true

      - name: Publicar informe de cobertura
        if: always() && hashFiles('build/reports/jacoco/test/html/index.html') != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cobertura-jacoco
          path: build/reports/jacoco/test/

      - name: Publicar reporte de Serenity
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reporte-serenity-${{ env.ENTORNO }}
          path: target/site/serenity/
          if-no-files-found: ignore

      - name: Publicar resultados JUnit
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: resultados-api-${{ env.ENTORNO }}
          path: build/test-results/test/
          if-no-files-found: ignore

  # Diario: los @defectoConocido deben seguir fallando. Si alguno pasa, la API lo corrigió y hay que
  # reclasificar el escenario; este job falla para avisar. También rendimiento, solo informativo.
  vigilancia:
    # Nombre fijo: si el job se omite (push y PR), GitHub no evalúa expresiones en el nombre
    name: Defectos conocidos y rendimiento
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    needs: verificacion
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '27'

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Levantar Restful Booker
        if: env.ENTORNO == 'docker'
        run: |
          docker compose up -d
          for _ in $(seq 1 30); do
            [ "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3001/ping)" = "201" ] && exit 0
            sleep 2
          done
          exit 1

      - name: Ejecutar @defectoConocido (se espera que fallen)
        run: ./gradlew test -Penv="$ENTORNO" -Ptags="@defectoConocido" || true

      - name: Comprobar que ningún defecto conocido se ha corregido
        run: python3 .github/scripts/resumen_pruebas.py build/test-results/test "Defectos conocidos ($ENTORNO)" --vigilar-defectos | tee -a "$GITHUB_STEP_SUMMARY"; exit "${PIPESTATUS[0]}"

      - name: Rendimiento (informativo)
        if: always()
        continue-on-error: true
        run: |
          ./gradlew test -Penv="$ENTORNO" -Ptags="@rendimiento" || true
          python3 .github/scripts/resumen_pruebas.py build/test-results/test "Rendimiento ($ENTORNO, informativo)" >> "$GITHUB_STEP_SUMMARY"

  # Publica el reporte de Serenity de main en GitHub Pages.
  # Requiere activar una vez: Settings → Pages → Source: "GitHub Actions".
  reporte:
    name: Publicar reporte en GitHub Pages
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: api
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: reporte-serenity-docker
          path: reporte

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: reporte

      - id: despliegue
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

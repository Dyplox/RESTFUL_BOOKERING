plugins {
    id 'java'
    id 'eclipse'
    id 'idea'
    id 'net.serenity-bdd.serenity-gradle-plugin' version '5.4.2'
    id 'org.sonarqube' version '7.6.0.18749'
}

repositories {
    mavenLocal()
    mavenCentral()
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(27)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

ext {
    serenityVersion = '5.4.2'
    cucumberVersion = '8.1.0'
    restAssuredVersion = '6.3.0'
    junitVersion = '6.1.3'
}

dependencies {
    implementation "net.serenity-bdd:serenity-core:${serenityVersion}"
    implementation "net.serenity-bdd:serenity-screenplay-rest:${serenityVersion}"
    implementation "io.cucumber:cucumber-java:${cucumberVersion}"
    implementation 'com.google.code.gson:gson:2.15.0'

    testImplementation "net.serenity-bdd:serenity-cucumber:${serenityVersion}"
    testImplementation "io.rest-assured:rest-assured:${restAssuredVersion}"
    testImplementation "io.rest-assured:json-schema-validator:${restAssuredVersion}"
    testImplementation 'org.hamcrest:hamcrest:3.0'

    testImplementation platform("org.junit:junit-bom:${junitVersion}")
    testImplementation 'org.junit.platform:junit-platform-suite'
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testImplementation "io.cucumber:cucumber-junit-platform-engine:${cucumberVersion}"
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

// Getters, setters y constantes triviales no llevan Javadoc: se omite solo el grupo 'missing' de doclint
tasks.withType(Javadoc).configureEach {
    options.encoding = 'UTF-8'
    options.addStringOption('Xdoclint:all,-missing', '-quiet')
}

tasks.withType(Test).configureEach {
    // Serenity REST (RestSpecificationFactory) inyecta clases con ByteBuddy mediante reflexión sobre
    // ClassLoader.defineClass; en Java 26+ hay que abrir java.lang y habilitar la vía Unsafe explícitamente.
    // Ojo: en Java 26+ net.bytebuddy.safe vale true por defecto y es 'false' lo que reactiva Unsafe
    // (el mensaje de error de ByteBuddy dice lo contrario).
    jvmArgs '--add-opens', 'java.base/java.lang=ALL-UNNAMED'
    systemProperty 'net.bytebuddy.safe', 'false'
}

// Pruebas de API (Cucumber + Serenity) contra la API real. Filtrar con: ./gradlew test -Ptags="@smoke"
// Sin -Ptags se usa el filtro de junit-platform.properties (todo menos @defectoConocido y @rendimiento).
// Con -Ptags, esos dos tags se siguen excluyendo salvo que la expresión los mencione explícitamente.
// Si una prueba falla, el build falla; el reporte de Serenity se genera igual (finalizedBy).
tasks.named('test', Test) {
    description = 'Ejecuta las pruebas de API (Cucumber) contra Restful Booker.'
    useJUnitPlatform {
        includeEngines 'junit-platform-suite'
    }
    // Entorno de serenity.conf: ./gradlew test -Penv=docker (por defecto, la API pública)
    if (project.hasProperty('env')) {
        systemProperty 'environment', project.property('env')
    }
    if (project.hasProperty('tags')) {
        String tags = project.property('tags').toString()
        ['@defectoConocido', '@rendimiento'].each { excluido ->
            if (!tags.contains(excluido)) {
                tags = "(${tags}) and not ${excluido}"
            }
        }
        systemProperty 'cucumber.filter.tags', tags
    }
    // Cada ejecución consulta una API externa: nunca se considera "al día"
    outputs.upToDateWhen { false }
    // Borra los resultados de Serenity de ejecuciones anteriores para que el reporte no las mezcle
    dependsOn 'clearReports'
    finalizedBy(aggregate)
}

// El reporte se regenera siempre después de 'test' (Gradle lo daba por "al día" y dejaba uno viejo)
tasks.named('aggregate') {
    outputs.upToDateWhen { false }
}

// Pruebas unitarias (JUnit Jupiter): no usan red, son rápidas
tasks.register('unitTest', Test) {
    description = 'Ejecuta las pruebas unitarias (sin red).'
    group = 'verification'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform {
        includeEngines 'junit-jupiter'
    }
}

// Valida sin red que cada paso de las features tiene su step definition (dry-run de Cucumber)
tasks.register('validarFeatures', Test) {
    description = 'Comprueba en dry-run que todos los pasos de las features están implementados.'
    group = 'verification'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform {
        includeEngines 'junit-platform-suite'
    }
    systemProperty 'cucumber.execution.dry-run', 'true'
    systemProperty 'cucumber.plugin', 'summary'
    systemProperty 'cucumber.filter.tags', 'not @ninguno'
    systemProperty 'cucumber.execution.parallel.enabled', 'false'
}

tasks.named('check') {
    dependsOn 'unitTest', 'validarFeatures'
}

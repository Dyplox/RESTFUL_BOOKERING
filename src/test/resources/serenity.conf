# Configuración de Serenity (HOCON).
# Entorno por defecto: "publico". Elegir otro con: ./gradlew test -Penv=docker

serenity {
  project.name = "RestFul-Booker Test API"
  report.encoding = UTF8
  verbose.steps = false
}

feature.file.encoding = UTF8

environments {
  # API pública compartida (Heroku). Puede tener latencia y caídas puntuales.
  default {
    restapi.baseurl = "https://restful-booker.herokuapp.com/"
  }
  publico {
    restapi.baseurl = "https://restful-booker.herokuapp.com/"
  }
  # Contenedor local: docker run -d -p 3001:3001 mwinteringham/restfulbooker
  docker {
    restapi.baseurl = "http://localhost:3001/"
  }

  # Común a todos los entornos. Son las credenciales públicas de demostración de Restful Booker.
  # Las variables de entorno RESTFUL_BOOKER_USUARIO y RESTFUL_BOOKER_CLAVE tienen prioridad (las
  # resuelve co.booker.utils.Configuracion: Serenity no resuelve ${?VAR} dentro de environments).
  all {
    restapi.usuario = "admin"
    restapi.clave = "password123"
  }
}

# Configuración del motor de Cucumber (JUnit Platform). Los valores pasados como propiedades de
# sistema (p. ej. -Ptags en Gradle -> cucumber.filter.tags) tienen prioridad sobre este archivo.

cucumber.glue=co.booker.stepdefinitions
cucumber.plugin=pretty,net.serenitybdd.cucumber.core.plugin.SerenityReporterParallel
cucumber.snippet-type=camelcase

# Por defecto no se ejecutan los escenarios que documentan defectos conocidos de la API ni los de
# rendimiento (dependen de la latencia de red). Ejecutarlos con -Ptags="@defectoConocido" o "@rendimiento".
cucumber.filter.tags=not @defectoConocido and not @rendimiento

# Ejecución en paralelo: cada escenario es independiente (crea y limpia sus propios datos)
cucumber.execution.parallel.enabled=true
cucumber.execution.parallel.config.strategy=fixed
cucumber.execution.parallel.config.fixed.parallelism=4
cucumber.execution.parallel.config.fixed.max-pool-size=4
